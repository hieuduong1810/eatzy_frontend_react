name: CI/CD Eatzy Frontend

on:
  push:
    branches: ["main"]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Lấy source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Login Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3. Build 4 Docker images
      - name: Build Admin image
        run: |
          docker build \
            --build-arg APP_NAME=admin \
            --build-arg VITE_MAPBOX_ACCESS_TOKEN="${{ secrets.VITE_MAPBOX_ACCESS_TOKEN }}" \
            -t "${{ secrets.DOCKERHUB_USER }}/eatzy_admin:latest" .

      - name: Build Customer image
        run: |
          docker build \
            --build-arg APP_NAME=customer \
            --build-arg VITE_MAPBOX_ACCESS_TOKEN="${{ secrets.VITE_MAPBOX_ACCESS_TOKEN }}" \
            -t "${{ secrets.DOCKERHUB_USER }}/eatzy_customer:latest" .

      - name: Build Driver image
        run: |
          docker build \
            --build-arg APP_NAME=driver \
            --build-arg VITE_MAPBOX_ACCESS_TOKEN="${{ secrets.VITE_MAPBOX_ACCESS_TOKEN }}" \
            -t "${{ secrets.DOCKERHUB_USER }}/eatzy_driver:latest" .

      - name: Build Restaurant image
        run: |
          docker build \
            --build-arg APP_NAME=restaurant \
            --build-arg VITE_MAPBOX_ACCESS_TOKEN="${{ secrets.VITE_MAPBOX_ACCESS_TOKEN }}" \
            -t "${{ secrets.DOCKERHUB_USER }}/eatzy_restaurant:latest" .

      # 4. Push 4 images lên Docker Hub
      - name: Push all images
        run: |
          docker push "${{ secrets.DOCKERHUB_USER }}/eatzy_admin:latest"
          docker push "${{ secrets.DOCKERHUB_USER }}/eatzy_customer:latest"
          docker push "${{ secrets.DOCKERHUB_USER }}/eatzy_driver:latest"
          docker push "${{ secrets.DOCKERHUB_USER }}/eatzy_restaurant:latest"

      # 5. SSH vào server & deploy qua docker compose
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT }}
          script: |
            cd /home/hieu/projects/eatzy_frontend_react
            docker compose pull
            docker compose up -d
            docker image prune -f
